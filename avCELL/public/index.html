<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="tr" lang="tr">

<head>
    <title>avCELL</title>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <meta name="keywords" content="Graph, avCELL, Tablolama">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="made by mADEMatik">
    <meta name="author" content="made by mADEMatik">
    <link rel="stylesheet" href="style.css" type="text/css" />
    <link rel="shortcut icon" href="icons/favicon.svg" />
</head>

<body>
    <main id="app-shell">
        <header id="top-bar">
            <h2 class="app-logo">
                <img src="icons/logo.svg" alt="avCELL" />
            </h2>
            <section id="menu-bar" aria-label="Ana menü">
                <nav class="text-menu">
                    <div class="menu-shell">
                        <button id="file-menu-btn" type="button">Dosya</button>
                        <div id="file-menu" class="text-menu-popover" hidden>
                            <button id="save-file-btn" type="button">Kaydet</button>
                            <button id="save-as-file-btn" type="button">Farklı kaydet</button>
                        </div>
                    </div>
                    <button type="button">Düzenle</button>
                    <button type="button">Görünüm</button>
                    <button type="button">Ekle</button>
                    <button type="button">Biçim</button>
                    <button type="button">Veri</button>
                    <button type="button">Araçlar</button>
                    <button type="button">Yardım</button>
                </nav>
            </section>

            <section id="control-panel" aria-label="Araç çubuğu">
                <div class="toolbar-group">
                    <div class="toolbar-cluster">
                        <button id="undo-btn" class="icon-btn" title="Geri Al (Ctrl+Z)">
                            <img src="icons/undo.svg" alt="" />
                        </button>
                        <button id="redo-btn" class="icon-btn" title="Yinele (Ctrl+Y)">
                            <img src="icons/redo.svg" alt="" />
                        </button>
                    </div>
                    <div class="toolbar-cluster">
                        <button id="add-row-btn" class="icon-btn" title="Üste Satır Ekle">
                            <img src="icons/addrowend.svg" alt="" />
                        </button>
                        <button id="remove-row-btn" class="icon-btn" title="Satır Sil">
                            <img src="icons/delrowend.svg" alt="" />
                        </button>
                    </div>
                    <div class="toolbar-cluster">
                        <button id="add-col-btn" class="icon-btn" title="Sola Sütun Ekle">
                            <img src="icons/addcolleft.svg" alt="" />
                        </button>
                        <button id="remove-col-btn" class="icon-btn" title="Sütun Sil">
                            <img src="icons/delcolend.svg" alt="" />
                        </button>
                    </div>
                    <div class="toolbar-cluster">
                        <button id="border-btn" class="icon-btn" title="Kenarlıklar">
                            <img src="icons/border-menu.svg" alt="" />
                        </button>
                        <button id="merge-btn" class="icon-btn" title="Hücreleri birleştir">
                            <img src="icons/merge-cells.svg" alt="" />
                        </button>
                    </div>
                    <div class="toolbar-cluster">
                        <button id="bold-btn" class="icon-btn" title="Kalın">
                            <img src="icons/text-bold.svg" alt="" />
                        </button>
                        <button id="italic-btn" class="icon-btn" title="İtalik">
                            <img src="icons/text-italic.svg" alt="" />
                        </button>
                        <button id="underline-btn" class="icon-btn" title="Altı çizili">
                            <img src="icons/text-underline.svg" alt="" />
                        </button>
                        <button id="font-size-decrease-btn" class="icon-btn" title="Yazı boyutunu azalt">
                            <img src="icons/text-size-decrease.svg" alt="" />
                        </button>
                        <button id="font-size-increase-btn" class="icon-btn" title="Yazı boyutunu artır">
                            <img src="icons/text-size-increase.svg" alt="" />
                        </button>
                        <button id="text-color-btn" class="icon-btn" title="Yazı rengi">
                            <img src="icons/text-color.svg" alt="" />
                        </button>
                        <button id="fill-color-btn" class="icon-btn" title="Dolgu rengi">
                            <img src="icons/fill-color.svg" alt="" />
                        </button>
                        <input id="text-color-input" class="hidden-color-input" type="color" value="#202124" aria-label="Yazı rengi" />
                        <input id="fill-color-input" class="hidden-color-input" type="color" value="#fff2cc" aria-label="Dolgu rengi" />
                    </div>
                </div>
            </section>
        </header>

        <section id="formula-bar">
            <input id="cell-name" aria-label="Hücre adı" value="A1" autocomplete="off" spellcheck="false" />
            <div id="formula-box">
                <span id="formula-mark">fx</span>
                <input id="formula-input" aria-label="Formül çubuğu" autocomplete="off" />
            </div>
        </section>

        <!-- TABLE AREA -->
        <section id="table-area">
            <table id="data-table"></table>
        </section>

        <section id="sheet-tabs">
            <button class="sheet-tab active" type="button">Sayfa1</button>
        </section>
    </main>

    <!-- CHART INPUT PANEL: hidden for now, kept for later -->
    <section id="chart-inputs" class="future-chart-panel" hidden>
        <input id="chart-x-range" placeholder="Başlıklar (X): A1:A5" />
        <input id="chart-y-range" placeholder="Veriler (Y): B1:B5" />
        <button id="draw-chart-btn" type="button" title="Grafik Çiz">
            <img src="icons/addgraph.svg" alt="" />
        </button>
        <button id="clear-chart-btn" type="button" title="Temizle">
            <img src="icons/clear.svg" alt="" />
        </button>
    </section>

    <!-- CHART TYPE SELECTION: hidden for now, kept for later -->
    <section id="chart-type" class="future-chart-panel" hidden>
        <label>
            <input type="radio" name="chartType" value="bar" checked />Sütun
        </label>
        <label>
            <input type="radio" name="chartType" value="pie" />Pasta
        </label>
        <label>
            <input type="radio" name="chartType" value="line" />Doğru
        </label>
    </section>

    <!-- CHART AREA: hidden for now, kept for later -->
    <section id="chart-area" class="future-chart-panel" hidden>
        <canvas id="chartCanvas"></canvas>
    </section>

    <div id="context-menu" hidden>
        <button type="button" data-action="cut">Kes</button>
        <button type="button" data-action="copy">Kopyala</button>
        <button type="button" data-action="paste">Yapıştır</button>
        <hr>
        <button type="button" data-action="insert-row-above">Üste satır ekle</button>
        <button type="button" data-action="delete-row">Satır sil</button>
        <button type="button" data-action="insert-col-left">Sola sütun ekle</button>
        <button type="button" data-action="delete-col">Sütun sil</button>
        <hr>
        <button type="button" data-action="add-sheet">Sayfa ekle</button>
        <button type="button" data-action="rename-sheet">Ad değiştir</button>
        <button type="button" data-action="delete-sheet">Sayfa sil</button>
        <hr>
        <button type="button" data-action="clear">Hücreleri temizle</button>
        <button type="button" data-action="note">Not ekle</button>
    </div>

    <div id="border-menu" class="toolbar-menu" hidden>
        <button type="button" data-border-action="all" title="Tüm kenarlıklar">
            <img src="icons/border-all.svg" alt="" />
        </button>
        <button type="button" data-border-action="outer" title="Dış kenarlık">
            <img src="icons/border-outer.svg" alt="" />
        </button>
        <button type="button" data-border-action="inner" title="İç kenarlık">
            <img src="icons/border-inner.svg" alt="" />
        </button>
        <button type="button" data-border-action="top" title="Üst kenarlık">
            <img src="icons/border-top.svg" alt="" />
        </button>
        <button type="button" data-border-action="bottom" title="Alt kenarlık">
            <img src="icons/border-bottom.svg" alt="" />
        </button>
        <button type="button" data-border-action="left" title="Sol kenarlık">
            <img src="icons/border-left.svg" alt="" />
        </button>
        <button type="button" data-border-action="right" title="Sağ kenarlık">
            <img src="icons/border-right.svg" alt="" />
        </button>
        <button type="button" data-border-action="clear" title="Kenarlıkları temizle">
            <img src="icons/border-clear.svg" alt="" />
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>

</html>
